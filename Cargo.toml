[package]
name = "holon-vc"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "CC0-1.0"
description = "Verifiable Holon assertions with explicit cryptographic and trust results"

[dependencies]
sophia_c14n = "=0.10.0"
sophia_api = "=0.10.0"
sophia_inmem = "=0.10.0"
sophia_turtle = "=0.10.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
json-syntax = "=0.12.5"
iref = "=3.2.2"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "jwk"] }
rand = "=0.8.5"
sha2 = "=0.10.9"
multibase = "=0.9.2"
base64 = "=0.22.1"
thiserror = "=2.0.21"
ssi-di-sd-primitives = "=0.3.0"
ssi-core = "=0.3.0"
ssi-json-ld = "=0.3.3"
ssi-rdf = "=0.1.1"
rdf-types = "=0.22.5"
serde_cbor = "=0.11.2"
zeroize = { version = "=1.9.0", features = ["derive"] }
clap = { version = "=4.6.7", features = ["derive", "string"] }
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
url = "=2.5.8"
jsonschema = { version = "=0.58.1", default-features = false }
toml = "=0.9.12"
argon2 = "=0.6.0"
chacha20poly1305 = "=0.11.0"
rpassword = "=7.5.4"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
rusqlite = { version = "=0.38.0", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
flate2 = "=1.1.10"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
debug = 1

[profile.release]
strip = true
lto = "thin"

# Speed up the real password KDF in developer builds without reducing its work parameters.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
